<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --accent-1: #ff7a59;
      --accent-2: #e8336d;
      --knob: url("icons/knob.svg");
      --pct: 50%;

      /* Dark theme colours */
      --frame: #1b1b1f;   /* popup window background, close to Chrome's dark UI */
      --card: #26262c;    /* the rounded panel */
      --text: #f1f1f4;
      --muted: #8b8b96;
      --track: #3a3a42;

      color-scheme: dark; /* dark scrollbars & form defaults */
    }
    html, body { background: var(--frame); }
    body {
      font: 14px system-ui, sans-serif;
      margin: 0;
      padding: 8px;
      color: var(--text);
    }
    /* Chrome draws the popup window itself, so we can't round its outer corners.
       Instead we put everything on a rounded card that sits on a matching dark frame. */
    .card {
      width: 240px;
      padding: 14px 16px 12px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid #ffffff12;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    h1 { font-size: 14px; margin: 0; }
    #val {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      color: transparent;
    }

    /* ---- The slider ---- */
    input[type=range] {
      -webkit-appearance: none;   /* drop Chrome's default look */
      appearance: none;
      width: 100%;
      height: 40px;               /* room for the big knob */
      margin: 6px 0 0;
      background: transparent;
      cursor: pointer;
    }
    /* The track: filled part is a gradient, the rest is grey. --pct is set from JS */
    input[type=range]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 99px;
      background:
        linear-gradient(90deg, var(--accent-1), var(--accent-2)) 0 / var(--pct) 100% no-repeat,
        var(--track);
    }
    /* The knob (Chrome calls it the "thumb") */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 34px;
      height: 34px;
      margin-top: -13px;          /* (8px track - 34px knob) / 2 = centre it */
      border: none;
      background: var(--knob) center / contain no-repeat;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
      transition: transform .15s;
    }
    html, body, .card { transition: background-color .25s; }
    input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.1) rotate(-8deg); }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2) rotate(8deg); }

    /* ---- Theme swatches ---- */
    h2 { font-size: 13px; margin: 14px 0 8px; font-weight: 600; }
    #swatches { display: flex; gap: 10px; }
    .swatch {
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: transform .15s, outline-color .15s;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { outline-color: var(--text); }

    .ticks {
      display: flex;
      justify-content: space-between;
      padding: 0 13px;            /* tick centres line up with knob centres */
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
<div class="card">
  <header>
    <h1>Videos per row</h1>
    <span id="val"></span>
  </header>
  <input id="slider" type="range" min="2" max="10">
  <div class="ticks"><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div>

  <h2>Theme</h2>
  <div id="swatches"></div>
</div>
<script src="themes.js"></script>
<script src="popup.js"></script>
</body>
</html>
