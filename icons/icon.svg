<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#e8336d"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <!-- 2 rows x 3 columns of little video tiles -->
  <g fill="#fff">
    <rect x="22" y="30" width="24" height="26" rx="7"/>
    <rect x="52" y="30" width="24" height="26" rx="7"/>
    <rect x="82" y="30" width="24" height="26" rx="7"/>
    <rect x="22" y="72" width="24" height="26" rx="7"/>
    <rect x="52" y="72" width="24" height="26" rx="7"/>
    <rect x="82" y="72" width="24" height="26" rx="7" fill-opacity=".55"/>
  </g>
  <!-- tiny play triangles -->
  <g fill="#e8336d">
    <path d="M30 37.5 L40 43 L30 48.5 Z"/>
    <path d="M60 79.5 L70 85 L60 90.5 Z"/>
  </g>
</svg>
